    <linearGradient id="ar-tent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0e6d2"/><stop offset="100%" stop-color="#cdbb9b"/>
    </linearGradient>
    <pattern id="ar-grass" width="210" height="190" patternUnits="userSpaceOnUse">
