name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run balance -- check

      # GitHub Pages serves this repository's root as it is, so the built site
      # is committed. This fails if it no longer matches the sources.
      - name: the committed build is up to date
        run: |
          npm run build
          if [ -n "$(git status --porcelain index.html assets)" ]; then
            echo "The committed build is stale. Run: npm run build"
            git status --porcelain index.html assets
            exit 1
          fi
